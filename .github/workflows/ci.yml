name: Model Training and CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  MLFLOW_TRACKING_URI: "file:./mlruns"

jobs:
  ci-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python 3.12.7
        uses: actions/setup-python@v4
        with:
          python-version: '3.12.7'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Check Env
        run: |
          python --version
          pip --version
          docker --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow==2.19.0 pandas scikit-learn matplotlib seaborn

      - name: Run mlflow project
        run: |
          mlflow run MLProject --env-manager=local

      - name: Get latest MLflow run_id with model artifact
        id: get_run_id
        run: |
          RUN_INFO=$(python -c "import mlflow; client = mlflow.tracking.MlflowClient('file:./mlruns'); exps = client.search_experiments(); exp_ids = [e.experiment_id for e in exps]; runs = client.search_runs(experiment_ids=exp_ids, order_by=['attribute.start_time DESC']); target_run = next((r for r in runs if any(a.path == 'model' for a in client.list_artifacts(r.info.run_id))), runs[0]); print(f'{target_run.info.experiment_id},{target_run.info.run_id}')")
          EXP_ID=$(echo $RUN_INFO | cut -d',' -f1)
          RUN_ID=$(echo $RUN_INFO | cut -d',' -f2)
          echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV
          echo "EXP_ID=$EXP_ID" >> $GITHUB_ENV
          echo "Run ID ditemukan: $RUN_ID (Exp ID: $EXP_ID)"

      - name: Verify model artifact
        run: |
          ls -la mlruns/${{ env.EXP_ID }}/${{ env.RUN_ID }}/artifacts/model/

      - name: Upload to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: mlruns/${{ env.EXP_ID }}/${{ env.RUN_ID }}/artifacts/model/

      - name: Build Docker Model
        run: |
          mlflow models build-docker -m "runs:/${{ env.RUN_ID }}/model" -n "rifkif00/workflow-ci:latest" --env-manager=local

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Tag Docker Image
        run: |
          docker tag rifkif00/workflow-ci:latest ${{ secrets.DOCKER_HUB_USERNAME }}/workflow-ci:latest

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/workflow-ci:latest
