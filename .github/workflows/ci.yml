name: Model Training and CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  ci-pipeline:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python 3.12.7
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"

      - name: Check Env
        run: |
          python --version
          pip --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow==2.19.0 pandas scikit-learn matplotlib seaborn

      - name: Run mlflow project
        run: |
          mlflow run MLProject --env-manager=local

      - name: Get latest MLflow run_id and model path
        id: get_run_id
        run: |
          MODEL_PATH=$(find . -type d -path "*/artifacts/model" 2>/dev/null | head -n 1)
          echo "MODEL_PATH=$MODEL_PATH" >> $GITHUB_ENV
          echo "Found MODEL_PATH: $MODEL_PATH"
          ls -la "$MODEL_PATH"

      - name: Upload to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: ${{ env.MODEL_PATH }}

      - name: Build Docker Model
        run: |
          find /opt/hostedtoolcache/Python \
            -name docker_utils.py \
            -exec sed -i \
            's|https://bootstrap.pypa.io/get-pip.py|https://bootstrap.pypa.io/pip/3.9/get-pip.py|g' \
            {} + || true

          mlflow models build-docker \
            -m "${{ env.MODEL_PATH }}" \
            -n "rifkif00/workflow-ci:latest"

      - name: Log in to Docker Hub
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME || secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN || secrets.DOCKER_PASSWORD }}

      - name: Tag Docker Image
        continue-on-error: true
        run: |
          DOCKER_USER="${{ secrets.DOCKER_HUB_USERNAME || secrets.DOCKER_USERNAME }}"
          if [ -n "$DOCKER_USER" ]; then
            docker tag rifkif00/workflow-ci:latest "$DOCKER_USER/workflow-ci:latest"
            docker tag rifkif00/workflow-ci:latest "$DOCKER_USER/workflow-ci:v1.0"
          fi

      - name: Push Docker Image
        continue-on-error: true
        run: |
          DOCKER_USER="${{ secrets.DOCKER_HUB_USERNAME || secrets.DOCKER_USERNAME }}"
          if [ -n "$DOCKER_USER" ]; then
            docker push "$DOCKER_USER/workflow-ci:latest"
            docker push "$DOCKER_USER/workflow-ci:v1.0"
          fi
