name: Model Training and CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  MLFLOW_TRACKING_URI: "file:./mlruns"

jobs:
  ci-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python 3.12.7
        uses: actions/setup-python@v4
        with:
          python-version: '3.12.7'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Check Env
        run: |
          python --version
          pip --version
          docker --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow==2.19.0 pandas scikit-learn matplotlib seaborn

      - name: Run mlflow project
        run: |
          mlflow run MLProject --env-manager=local

      - name: Locate and verify model artifact
        id: find_model
        run: |
          MODEL_PATH=$(python -c "import glob, os; paths = sorted(glob.glob('**/artifacts/model', recursive=True), key=os.path.getmtime, reverse=True); print(paths[0] if paths else '')")
          echo "MODEL_PATH=$MODEL_PATH" >> $GITHUB_ENV
          echo "Found model path: $MODEL_PATH"
          ls -la "$MODEL_PATH"

      - name: Upload to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: ${{ env.MODEL_PATH }}

      - name: Build Docker Model
        run: |
          mlflow models build-docker -m "${{ env.MODEL_PATH }}" -n "rifkif00/workflow-ci:latest" --env-manager=local

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Tag Docker Image
        run: |
          docker tag rifkif00/workflow-ci:latest ${{ secrets.DOCKER_HUB_USERNAME }}/workflow-ci:latest

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/workflow-ci:latest
